# Ubuntu + nginx. Replace example.mn with your domain.
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/khongor
#   sudo ln -s /etc/nginx/sites-available/khongor /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d admin.example.mn -d api.example.mn

upstream restaurant_api {
  server 127.0.0.1:4004;
}

upstream restaurant_admin {
  server 127.0.0.1:3001;
}

server {
  listen 80;
  server_name api.example.mn;

  location / {
    proxy_pass http://restaurant_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

server {
  listen 80;
  server_name admin.example.mn;

  client_max_body_size 32m;

  location /downloads/ {
    alias /var/www/restaurant/deploy/;
    add_header Content-Disposition "attachment";
  }

  location / {
    proxy_pass http://restaurant_admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
